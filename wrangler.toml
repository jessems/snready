name = "snready"
compatibility_date = "2024-01-01"
pages_build_output_dir = "out"

# KV namespace for storing user access
[[kv_namespaces]]
binding = "SNREADY_ACCESS"
id = "bcb7c1925c84424cb90713533b286c63"

# Environment variables (set as secrets in Cloudflare Pages):
# - SITE_URL: Base URL (e.g., https://snready.com)
# - STRIPE_SECRET_KEY: Stripe API key
# - STRIPE_WEBHOOK_SECRET: Stripe webhook signing secret
# - RESEND_API_KEY: Resend.com API key for check-in emails
# - CRON_SECRET: Secret token for /api/cron/* endpoints
# - ADMIN_SECRET: Secret token for /api/admin/* endpoints
